<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Car Blog - 에디터 대시보드</title>
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 10% 20%, rgba(30, 41, 59, 0.4) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(15, 23, 42, 0.6) 0%, transparent 45%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-highlight {
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }
        /* Custom scrollbar for preview */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 네이버, 티스토리 폰트 유틸 */
        .font-nanum { font-family: 'Nanum Gothic', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }

        /* 네이버 특유의 인용구 스타일 */
        .naver-quote { border-left: 4px solid #03C75A; padding-left: 1rem; color: #555; background: #f9f9f9; padding-top: 0.5rem; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans selection:bg-blue-500/30">
    
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <!-- Top Navigation Bar -->
    <nav class="glass sticky top-0 z-40 w-full px-6 py-4 flex justify-between items-center mb-8">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🚗</span>
            <h1 class="text-xl font-bold font-outfit tracking-wide bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                AUTO CAR BLOG CONTROL PANEL
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                Telegram Bot Online
            </span>
        </div>
    </nav>

    <!-- Main Grid Container -->
    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- LEFT COLUMN: Configurations (Scheduler & Keywords) -->
        <section class="space-y-8 lg:col-span-1">
            
            <!-- 1. Scheduler Control Card -->
            <div class="glass rounded-2xl p-6 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold font-outfit text-blue-400 flex items-center">
                        <span class="mr-2">⏱️</span>정기 브리핑 스케줄러
                    </h2>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="scheduler-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2" for="schedule-interval">수집 주기 (시간단위)</label>
                        <div class="flex space-x-2">
                            <input type="number" id="schedule-interval" min="1" max="168" value="24" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
                            <span class="inline-flex items-center px-3 text-sm text-slate-400 bg-slate-800/50 rounded-xl border border-slate-700">시간</span>
                        </div>
                    </div>
                    <button onclick="saveScheduleSettings()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-500/20">
                        설정 저장하기
                    </button>
                </div>
            </div>

            <!-- 2. Keyword Management Card -->
            <div class="glass rounded-2xl p-6 space-y-6">
                <h2 class="text-lg font-semibold font-outfit text-blue-400 flex items-center">
                    <span class="mr-2">🔑</span>수집 키워드 제어판
                </h2>
                
                <!-- Keyword Add Form -->
                <div class="space-y-3">
                    <input type="text" id="new-keyword" placeholder="예: IONIQ 5 N, Toyota GR86" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                    <div class="flex space-x-2">
                        <select id="keyword-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none text-slate-300">
                            <option value="뉴스">📰 뉴스</option>
                            <option value="커뮤니티">💬 커뮤니티</option>
                            <option value="리뷰">🎥 리뷰/유튜브</option>
                            <option value="이슈">⚠️ 결함/이슈</option>
                        </select>
                        <button onclick="addKeyword()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl text-sm font-semibold transition shrink-0">
                            추가
                        </button>
                    </div>
                </div>

                <!-- Keywords List -->
                <div class="border-t border-slate-800/80 pt-4">
                    <h3 class="text-xs text-slate-400 mb-3">등록된 키워드 목록</h3>
                    <ul id="keywords-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <!-- Dynamic content loaded via JS -->
                        <li class="text-slate-500 text-sm text-center py-4">불러오는 중...</li>
                    </ul>
                </div>
            </div>

        </section>

        <!-- RIGHT COLUMN: Task Monitoring (Status Timeline & Verification Board) -->
        <section class="space-y-8 lg:col-span-2">
            
            <!-- Task Board Header -->
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold font-outfit text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center">
                    <span class="mr-3">📡</span>실시간 작업 파이프라인 모니터링
                </h2>
                <button onclick="fetchTasks()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center bg-slate-800/40 border border-slate-700 px-3 py-1.5 rounded-lg transition">
                    <span class="mr-1.5">🔄</span>새로고침
                </button>
                <button onclick="cleanupTasks()" class="text-xs text-rose-400 hover:text-rose-300 flex items-center bg-slate-800/40 border border-slate-700 px-3 py-1.5 rounded-lg transition ml-2" title="누적된 오래된 카드를 최근 10개만 남기고 정리합니다">
                    <span class="mr-1.5">🗑️</span>카드 정리
                </button>
            </div>

            <!-- Task Status Container -->
            <div id="tasks-container" class="space-y-4">
                <!-- Dynamic cards populated via JS -->
                <div class="glass rounded-2xl p-8 text-center text-slate-400">
                    등록된 파이프라인 프로세스가 없습니다.
                </div>
            </div>

        </section>

    </main>

    <!-- MODAL: AI Article Preview & Manual Publishing -->
    <div id="preview-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 hidden opacity-0 transition-opacity duration-300">
        <div class="glass w-full max-w-4xl max-h-[85vh] rounded-2xl flex flex-col shadow-2xl transform scale-95 transition-transform duration-300">
            <!-- Modal Header -->
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div>
                        <span class="text-xs font-semibold text-blue-400 font-outfit tracking-widest uppercase">AI Draft Article Preview</span>
                        <h3 id="modal-title" class="text-lg font-bold text-slate-100 mt-1">포스팅 원고 제목</h3>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <!-- 플랫폼 탭 -->
                    <div class="flex bg-slate-900 rounded-lg p-1">
                        <button id="btn-plat-naver" onclick="switchPlatform('naver')" class="px-3 py-1 text-xs font-bold rounded-md bg-[#03C75A] text-white">네이버 뷰</button>
                        <button id="btn-plat-tistory" onclick="switchPlatform('tistory')" class="px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200">티스토리 뷰</button>
                        <button id="btn-plat-wordpress" onclick="switchPlatform('wordpress')" class="px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200">워드프레스 뷰</button>
                    </div>
                    <!-- 기기 토글 -->
                    <div class="flex bg-slate-900 rounded-lg p-1">
                        <button id="btn-device-desktop" onclick="toggleDeviceView('desktop')" class="px-3 py-1 text-xs font-bold rounded-md bg-slate-700 text-white">💻 데스크톱</button>
                        <button id="btn-device-mobile" onclick="toggleDeviceView('mobile')" class="px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200">📱 모바일</button>
                    </div>
                    <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white text-2xl font-bold ml-4">&times;</button>
                </div>
            </div>
            
            <!-- Modal Body (Content) -->
            <div class="p-6 overflow-y-auto flex-1 space-y-4 bg-slate-950/50">
                <div class="flex space-x-2 border-b border-slate-800 pb-3">
                    <button id="btn-tab-html" onclick="switchTab('html')" class="px-4 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white">반응형 HTML</button>
                    <button id="btn-tab-md" onclick="switchTab('md')" class="px-4 py-1.5 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">마크다운</button>
                </div>
                <!-- Content Area -->
                <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-4 min-h-[300px] flex justify-center items-start overflow-hidden">
                    <div id="preview-wrapper" class="w-full transition-all duration-300 mx-auto font-nanum leading-[1.8] max-w-[740px]">
                        <div id="modal-content-html" class="prose prose-invert max-w-none text-slate-300 text-sm w-full">
                            <!-- HTML preview content -->
                        </div>
                    </div>
                    <textarea id="modal-content-md" class="w-full min-h-[300px] bg-transparent text-slate-300 text-xs font-mono focus:outline-none hidden" readonly></textarea>
                </div>
            </div>
            
            <!-- Modal Footer (Publish buttons) -->
            <div class="p-6 border-t border-slate-800 flex flex-wrap justify-between items-center gap-4 bg-slate-950/30">
                <div class="text-xs text-slate-500 max-w-sm" style="word-break: break-all; white-space: normal; overflow-wrap: anywhere;">
                    출처 URL: <a id="modal-source-link" href="#" target="_blank" class="text-blue-500 hover:underline">바로가기</a>
                </div>
                <div class="flex space-x-2">
                    <button onclick="copyToClipboard()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 px-3 rounded-xl transition flex items-center">
                        <span class="mr-1">📋</span> 본문 복사
                    </button>
                    <button id="btn-pub-naver" onclick="triggerPublish('naver')" class="bg-[#03C75A] hover:bg-[#02b351] text-white text-xs font-bold py-2 px-3 rounded-xl transition">
                        네이버 발행 (초안)
                    </button>
                    <button id="btn-pub-tistory" onclick="triggerPublish('tistory')" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition">
                        티스토리 발행 (초안)
                    </button>
                    <button id="btn-pub-wordpress" onclick="triggerPublish('wordpress')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition">
                        워드프레스 발행 (초안)
                    </button>
                    <button onclick="closePreviewModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 px-3 rounded-xl transition">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT FRONTEND LOGIC -->
    <script>
        let currentDraftId = null;
        let currentActiveTab = 'html';
        let currentPlatform = 'naver';
        let currentDevice = 'desktop';
        let currentTaskDrafts = {}; // task_id -> draft data map

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            
            let bgClass = "bg-blue-600";
            let icon = "ℹ️";
            
            if (type === 'error') {
                bgClass = "bg-rose-600";
                icon = "⚠️";
            } else if (type === 'success') {
                bgClass = "bg-[#03C75A]";
                icon = "✅";
            } else if (type === 'warning') {
                bgClass = "bg-amber-600";
                icon = "⚠️";
            }
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-[-100%] opacity-0`;
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove("translate-y-[-100%]", "opacity-0");
            }, 10);
            
            // Animate out and remove
            setTimeout(() => {
                toast.classList.add("translate-y-[-100%]", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Initialize Web Dashboard
        document.addEventListener("DOMContentLoaded", () => {
            fetchKeywords();
            fetchScheduleSettings();
            fetchTasks();
            
            // Poll tasks every 5 seconds for live status monitoring
            setInterval(fetchTasks, 5000);
        });

        // --- 1. Keywords Control Logic ---
        async function fetchKeywords() {
            try {
                const res = await fetch("/api/keywords");
                const data = await res.json();
                const list = document.getElementById("keywords-list");
                list.innerHTML = "";
                
                if (data.length === 0) {
                    list.innerHTML = `<li class="text-slate-500 text-xs text-center py-4">등록된 키워드가 없습니다.</li>`;
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement("li");
                    li.className = "flex justify-between items-center bg-slate-900/50 hover:bg-slate-900 border border-slate-800/80 px-3.5 py-2.5 rounded-xl text-sm transition";
                    li.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">${item.category}</span>
                            <span class="font-medium text-slate-200">${item.keyword}</span>
                        </div>
                        <button onclick="deleteKeyword('${item.keyword}')" class="text-slate-500 hover:text-red-400 transition text-xs font-semibold">삭제</button>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("키워드 로드 실패:", err);
            }
        }

        async function addKeyword() {
            const kwInput = document.getElementById("new-keyword");
            const catSelect = document.getElementById("keyword-category");
            const keyword = kwInput.value.trim();
            const category = catSelect.value;
            
            if (!keyword) return;

            try {
                const res = await fetch("/api/keywords", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({keyword, category})
                });
                if (res.ok) {
                    kwInput.value = "";
                    fetchKeywords();
                }
            } catch (err) {
                console.error("키워드 추가 실패:", err);
            }
        }

        async function deleteKeyword(keyword) {
            if (!confirm(`'${keyword}' 키워드를 삭제하시겠습니까?`)) return;
            try {
                const res = await fetch(`/api/keywords?keyword=${encodeURIComponent(keyword)}`, {
                    method: "DELETE"
                });
                if (res.ok) {
                    fetchKeywords();
                }
            } catch (err) {
                console.error("키워드 삭제 실패:", err);
            }
        }

        // --- 2. Schedule Control Logic ---
        async function fetchScheduleSettings() {
            try {
                const res = await fetch("/api/schedule");
                const data = await res.json();
                document.getElementById("scheduler-toggle").checked = data.active;
                document.getElementById("schedule-interval").value = data.interval_hours;
            } catch (err) {
                console.error("스케줄 조회 실패:", err);
            }
        }

        async function saveScheduleSettings() {
            const active = document.getElementById("scheduler-toggle").checked;
            const interval_hours = parseInt(document.getElementById("schedule-interval").value) || 24;

            try {
                const res = await fetch("/api/schedule", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({active, interval_hours})
                });
                if (res.ok) {
                    alert("⏰ 스케줄 설정이 저장되었습니다.");
                }
            } catch (err) {
                console.error("스케줄 저장 실패:", err);
            }
        }

        // --- 3. Pipeline Task Monitoring Logic ---
        async function cleanupTasks() {
            if (!confirm('누적된 오래된 카드를 정리하시겠습니까? 최근 10개만 남깁니다.')) return;
            try {
                const res = await fetch('/api/tasks/cleanup', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert('✅ ' + data.message);
                    fetchTasks(); // 정리 후 바로 새로고침
                } else {
                    alert('❌ 정리 실패: ' + data.error);
                }
            } catch (e) {
                alert('❌ 요청 실패: ' + e.message);
            }
        }

        async function fetchTasks() {
            try {
                const res = await fetch("/api/tasks");
                const data = await res.json();
                const container = document.getElementById("tasks-container");
                container.innerHTML = "";
                
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="glass rounded-2xl p-8 text-center text-slate-500 text-sm">
                            실행된 포스팅 파이프라인 태스크가 없습니다.
                        </div>`;
                    return;
                }

                data.forEach(task => {
                    const card = document.createElement("div");
                    
                    // Status Badge & UI Color Mapping
                    let badgeClass = "";
                    let cardBorderClass = "";
                    
                    switch(task.status) {
                        case "수집중":
                            badgeClass = "bg-blue-500/10 text-blue-400 border border-blue-500/20";
                            break;
                        case "AI작성중":
                            badgeClass = "bg-purple-500/10 text-purple-400 border border-purple-500/20";
                            break;
                        case "발행대기":
                            badgeClass = "bg-amber-500/10 text-amber-400 border border-amber-500/20";
                            cardBorderClass = "glass-highlight";
                            break;
                        case "발행완료":
                            badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                            break;
                        case "반려됨":
                        case "실패":
                            badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/20";
                            break;
                        default:
                            badgeClass = "bg-slate-500/10 text-slate-400 border border-slate-500/20";
                    }

                    // Action buttons based on status
                    let actionHtml = "";
                    const draftId = task.platform_results ? task.platform_results.draft_id : null;
                    
                    if (task.status === "발행대기" && draftId) {
                        actionHtml = `
                            <button onclick="openPreviewModal('${draftId}')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                                검수 및 발행 🔍
                            </button>
                        `;
                    } else if (task.status === "발행완료") {
                        let linksHtml = "";
                        if (task.platform_results) {
                            if (task.platform_results.tistory) {
                                linksHtml += `<a href="${task.platform_results.tistory}" target="_blank" class="text-xs text-amber-400 hover:underline">Tistory</a> `;
                            }
                            if (task.platform_results.wordpress) {
                                linksHtml += `<a href="${task.platform_results.wordpress}" target="_blank" class="text-xs text-indigo-400 hover:underline">WordPress</a>`;
                            }
                        }
                        actionHtml = `<div class="flex space-x-2">${linksHtml || '<span class="text-xs text-slate-500">완료됨</span>'}</div>`;
                    }

                    card.className = `glass rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 transition duration-300 ${cardBorderClass}`;
                    
                    card.innerHTML = `
                        <div class="space-y-2.5 flex-1">
                            <div class="flex items-center space-x-3.5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold ${badgeClass}">
                                    ${task.status}
                                </span>
                                <h3 class="text-sm font-semibold text-slate-200">${task.title || "차종 분석 중"}</h3>
                            </div>
                            
                            <!-- progress bar -->
                            <div class="flex items-center space-x-3">
                                <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden">
                                    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-1.5 transition-all duration-500" style="width: ${task.progress}%"></div>
                                </div>
                                <span class="text-xs text-slate-500 font-medium">${task.progress}%</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-end shrink-0">
                            ${actionHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("작업 불러오기 실패:", err);
            }
        }

        // --- 4. Modal Draft Preview Logic ---
        async function openPreviewModal(draftId) {
            currentDraftId = draftId;
            const modal = document.getElementById("preview-modal");
            
            // Set initial state loading
            document.getElementById("modal-title").innerText = "불러오는 중...";
            document.getElementById("modal-content-html").innerHTML = "<p class='text-slate-500 text-center py-12'>초안 원고 데이터를 조회하는 중입니다...</p>";
            document.getElementById("modal-content-md").value = "";
            
            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                modal.querySelector(".transform").classList.remove("scale-95");
            }, 10);

            try {
                const res = await fetch(`/api/tasks/draft/${draftId}`);
                if (!res.ok) throw new Error("초안 조회 실패");
                const data = await res.json();
                
                document.getElementById("modal-title").innerText = data.title;
                document.getElementById("modal-content-html").innerHTML = data.html_content;
                document.getElementById("modal-content-md").value = data.html_content; // 마크다운 뷰어에 원본 코드 제공
                document.getElementById("modal-source-link").href = data.original_url || "#";
                document.getElementById("modal-source-link").innerText = data.original_url || "출처보기";
            } catch (err) {
                document.getElementById("modal-content-html").innerHTML = `<p class='text-red-500 text-center py-12'>오류: 데이터를 불러올 수 없습니다. (${err.message})</p>`;
            }
        }

        function closePreviewModal() {
            const modal = document.getElementById("preview-modal");
            modal.classList.add("opacity-0");
            modal.querySelector(".transform").classList.add("scale-95");
            setTimeout(() => {
                modal.classList.add("hidden");
            }, 300);
        }

        function switchTab(tab) {
            currentActiveTab = tab;
            const btnHtml = document.getElementById("btn-tab-html");
            const btnMd = document.getElementById("btn-tab-md");
            const contentHtmlWrapper = document.getElementById("preview-wrapper");
            const contentMd = document.getElementById("modal-content-md");
            
            if (tab === 'html') {
                contentHtmlWrapper.classList.remove("hidden");
                contentMd.classList.add("hidden");
                btnHtml.className = "px-4 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white";
                btnMd.className = "px-4 py-1.5 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700";
            } else {
                contentHtmlWrapper.classList.add("hidden");
                contentMd.classList.remove("hidden");
                btnHtml.className = "px-4 py-1.5 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700";
                btnMd.className = "px-4 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white";
            }
        }

        function switchPlatform(platform) {
            currentPlatform = platform;
            
            const btnNaver = document.getElementById("btn-plat-naver");
            const btnTistory = document.getElementById("btn-plat-tistory");
            const btnWordpress = document.getElementById("btn-plat-wordpress");
            
            btnNaver.className = "px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200";
            btnTistory.className = "px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200";
            btnWordpress.className = "px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200";
            
            const wrapper = document.getElementById("preview-wrapper");
            
            if (platform === 'naver') {
                btnNaver.className = "px-3 py-1 text-xs font-bold rounded-md bg-[#03C75A] text-white";
                wrapper.classList.remove("font-noto", "max-w-[780px]", "max-w-[720px]");
                wrapper.classList.add("font-nanum", "max-w-[740px]", "leading-[1.8]");
            } else if (platform === 'tistory') {
                btnTistory.className = "px-3 py-1 text-xs font-bold rounded-md bg-amber-600 text-white";
                wrapper.classList.remove("font-nanum", "max-w-[740px]", "max-w-[720px]", "leading-[1.8]");
                wrapper.classList.add("font-noto", "max-w-[780px]");
            } else if (platform === 'wordpress') {
                btnWordpress.className = "px-3 py-1 text-xs font-bold rounded-md bg-indigo-600 text-white";
                wrapper.classList.remove("font-nanum", "font-noto", "max-w-[740px]", "max-w-[780px]", "leading-[1.8]");
                wrapper.classList.add("max-w-[720px]");
            }
        }

        function toggleDeviceView(device) {
            currentDevice = device;
            
            const btnDesktop = document.getElementById("btn-device-desktop");
            const btnMobile = document.getElementById("btn-device-mobile");
            const wrapper = document.getElementById("preview-wrapper");

            btnDesktop.className = "px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200";
            btnMobile.className = "px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200";

            if (device === 'desktop') {
                btnDesktop.className = "px-3 py-1 text-xs font-bold rounded-md bg-slate-700 text-white";
                wrapper.classList.remove("w-[390px]", "border-slate-800", "rounded-[3rem]", "border-[12px]");
                wrapper.classList.add("w-full");
            } else if (device === 'mobile') {
                btnMobile.className = "px-3 py-1 text-xs font-bold rounded-md bg-slate-700 text-white";
                wrapper.classList.remove("w-full");
                wrapper.classList.add("w-[390px]", "border-slate-800", "rounded-[3rem]", "border-[12px]");
            }
        }

        async function copyToClipboard() {
            const mdContent = document.getElementById("modal-content-md").value;
            if (!mdContent) return;
            try {
                await navigator.clipboard.writeText(mdContent);
                showToast("✅ 본문이 클립보드에 복사되었습니다.", "success");
            } catch (err) {
                console.error("복사 실패:", err);
                showToast("⚠️ 클립보드 복사에 실패했습니다.", "error");
            }
        }

        async function triggerPublish(platform) {
            if (!currentDraftId) return;
            
            const btnNaver = document.getElementById("btn-pub-naver");
            const btnTistory = document.getElementById("btn-pub-tistory");
            const btnWordpress = document.getElementById("btn-pub-wordpress");
            
            // disable buttons
            btnNaver.disabled = true;
            btnTistory.disabled = true;
            btnWordpress.disabled = true;
            
            const prevText = {
                'naver': btnNaver.innerText,
                'tistory': btnTistory.innerText,
                'wordpress': btnWordpress.innerText
            };
            
            if (platform === 'naver') btnNaver.innerText = "발행중...";
            if (platform === 'tistory') btnTistory.innerText = "발행중...";
            if (platform === 'wordpress') btnWordpress.innerText = "발행중...";

            try {
                const res = await fetch("/api/publish", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        draft_id: currentDraftId,
                        platform: platform
                    })
                });
                
                const result = await res.json();
                if (res.ok && result.success) {
                    showToast(`[${platform.toUpperCase()}] 포스팅이 성공적으로 발행되었습니다!`, "success");
                    closePreviewModal();
                    fetchTasks(); // refresh task board
                } else {
                    // API 미연동 시 자동 복사 폴백 처리
                    await copyToClipboard();
                    const platName = platform === 'naver' ? '네이버' : (platform === 'tistory' ? '티스토리' : '워드프레스');
                    showToast(`⚠️ ${platName} API 연동 정보가 설정되지 않았습니다. 변환된 본문이 클립보드에 자동 복사되었습니다.`, "warning");
                }
            } catch (err) {
                // 네트워크 에러 시에도 폴백 동작
                await copyToClipboard();
                const platName = platform === 'naver' ? '네이버' : (platform === 'tistory' ? '티스토리' : '워드프레스');
                showToast(`⚠️ ${platName} API 연동 정보가 설정되지 않았습니다. 변환된 본문이 클립보드에 자동 복사되었습니다.`, "warning");
            } finally {
                btnNaver.disabled = false;
                btnTistory.disabled = false;
                btnWordpress.disabled = false;
                btnNaver.innerText = prevText['naver'];
                btnTistory.innerText = prevText['tistory'];
                btnWordpress.innerText = prevText['wordpress'];
            }
        }
    </script>
</body>
</html>

name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.110.114.94
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 실제 프로젝트가 위치한 폴더로 이동 (경로가 다르다면 수정해 주세요)
            cd ~/auto-car-blog
            
            # 최신 코드 가져오기
            git pull origin main
            
            # 서버 서비스 재시작
            sudo systemctl restart autoblog.service
